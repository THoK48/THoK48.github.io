name: Build and deploy Jekyll site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
      - id: pages
        uses: actions/configure-pages@v5
      - name: Set site URL for this Pages environment
        env:
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          ruby -ruri -ryaml -e 'u = URI(ENV.fetch("PAGES_URL")); File.write("_config_deploy.yml", {"url" => "#{u.scheme}://#{u.host}", "baseurl" => u.path.sub(%r{/$}, "")}.to_yaml)'
      - name: Build
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build --config _config.yml,_config_deploy.yml
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
